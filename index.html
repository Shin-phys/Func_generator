<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高校物理実験用音声ツール</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    h1 { font-size: 1.5em; margin-bottom: 0.5em; }
    .tabs { display: flex; flex-wrap: wrap; margin-bottom: 1em; }
    .tab-button {
      flex: none;
      margin: 2px;
      padding: 0.5em 1em;
      font-size: 1em;
      cursor: pointer;
      background: #ddd;
      border: none;
      border-radius: 4px;
    }
    .tab-button.active { background: #bbb; font-weight: bold; }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .control-group { margin: 1em 0; }
    label { margin-right: 0.5em; }
    input[type=range] { vertical-align: middle; margin: 0 0.5em; }

    /* まとめて数字＋単位を横並びにする */
  .freq-display {
    font-family: monospace;
    font-size: 1.2em;
    display: inline-flex;      /* ← flex に */
    align-items: center;
    gap: 0.4em;
    margin: 0.2em 0;
    white-space: nowrap;       /* ← 改行させない */
  }

  /* 共通のセルサイズ */
  .freq-grid {
    display: grid;
    gap: 2px;
    align-items: center;
    justify-items: center;
  }

  .freq-grid-6 {
    grid-template-columns: repeat(6, 1.6em);
    grid-template-rows: 1.6em 1.6em 1.6em;
  }

  .freq-grid-4 {
    grid-template-columns: repeat(4, 1.6em);
    grid-template-rows: 1.6em 1.6em 1.6em;
  }

  .freq-grid button,
  .freq-grid .digit,
  .freq-grid .empty-cell {
    width: 1.6em;
    height: 1.6em;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .freq-grid .digit-value {
    font-weight: bold;
    font-size: 1.1em;
  }

  .empty-cell {
    width: 1.6em;
    height: 1.6em;
  }

    .decimal-point { text-align: center; }

    .volume-control { margin-top: 0.5em; }
    .volume-display { margin-left: 0.5em; }

    /* ステレオ連続波モードのレイアウト（ユーザー指定） */
    .stereo-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-top: 0.5em;
      border: 1px solid #aaa;
      padding: 0.5em;
    }
    .channel {
      flex: 1 1 45%;
      min-width: 300px;
      border: 1px solid #bbb;
      padding: 0.5em;
      margin: 0.5em;
    }
    .channel h3 { font-size: 1.1em; margin-top: 0; }
    .wave-select { margin: 0.5em 0; }
    .wave-select label { margin-right: 1em; }
    .channel .volume-control { margin-top: 0.5em; }
    .channel .volume-display { margin-left: 0.5em; }

    .disabled { opacity: 0.5; pointer-events: none; }

    .param-label {
      font-size: 0.9em;
      margin-bottom: 0.1em;
    }


    /* スマホ向け：ステレオパネル縦並び */
    @media (max-width: 600px) {
      .stereo-container { flex-direction: column; }
      .channel { width: 100%; min-width: 0; }
      .tabs { flex-direction: column; }
    }
  </style>
</head>
<body>
<h1>高校物理実験用 音源生成ツール</h1>

<div class="tabs">
  <button class="tab-button active" data-target="mode1">単発パルス波</button>
  <button class="tab-button" data-target="mode2">ホワイトノイズ</button>
  <button class="tab-button" data-target="mode3">連続波（正弦波ほか）</button>
  <button class="tab-button" data-target="mode4">任意パルス</button>
</div>

<!-- モード1: 単発パルス波 -->

        <!-- ＋行 -->

        <button class="m1-freq-plus" data-digit="100">+</button>

<div class="channel" id="left-channel">

    <div class="freq-display">

        <!-- ＋行 -->

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

let currentMode = "mode1";

/* ========= タブ切替 ========= */
document.querySelectorAll(".tab-button").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = btn.dataset.target;
    if (target === currentMode) return;
    stopCurrentModeAudio();
    document.querySelectorAll(".tab-button").forEach(b =>
      b.classList.toggle("active", b === btn)
    );
    document.querySelectorAll(".mode-panel").forEach(p =>
      p.classList.toggle("active", p.id === target)
    );
    currentMode = target;
  });
});

function stopCurrentModeAudio() {
  if (currentMode === "mode2") {
    stopNoise();
  } else if (currentMode === "mode3") {
    stopLeftOsc();
    stopRightOsc();
    document.getElementById("m3-left-toggle").textContent  = "再生";
    document.getElementById("m3-right-toggle").textContent = "再生";
  } else if (currentMode === "mode4") {
    stopPulseTrain();
  }
}

// 4桁＋小数（周波数など）
function updateDigitGrid(prefix, tenths) {
  if (tenths < 0) tenths = 0;
  if (tenths > 99999) tenths = 99999;
  const intPart = Math.floor(tenths / 10);
  const decPart = tenths % 10;
  const intStr = intPart.toString().padStart(4, "0");
  document.getElementById(prefix + "-thousands").textContent = intStr[0];
  document.getElementById(prefix + "-hundreds").textContent  = intStr[1];
  document.getElementById(prefix + "-tens").textContent      = intStr[2];
  document.getElementById(prefix + "-ones").textContent      = intStr[3];
  document.getElementById(prefix + "-tenths").textContent    = decPart.toString();
}

// 2桁＋小数（パルス幅用：0.1〜30.0ms など）
function updateDigitGrid2(prefix, tenths, maxTenths) {
  if (tenths < 0) tenths = 0;
  if (typeof maxTenths === "number" && tenths > maxTenths) {
    tenths = maxTenths;
  }
  const intPart = Math.floor(tenths / 10); // 0〜30 など
  const decPart = tenths % 10;
  const intStr = intPart.toString().padStart(2, "0");
  document.getElementById(prefix + "-tens").textContent   = intStr[0];
  document.getElementById(prefix + "-ones").textContent   = intStr[1];
  document.getElementById(prefix + "-tenths").textContent = decPart.toString();
}



/* ========= モード1: 単発パルス ========= */
let mode1Gain = audioCtx.createGain();
mode1Gain.connect(audioCtx.destination);
let mode1Muted = false;
let mode1Volume = 0.1;
mode1Gain.gain.value = mode1Volume;

let mode1FreqTenths  = 10000; // 1000.0 Hz
let mode1WidthTenths = 10;    // 1.0 ms
updateDigitGrid("m1-freq",  mode1FreqTenths);
updateDigitGrid2("m1-width", mode1WidthTenths, 300); // 30.0msまで

let mode4FreqTenths  = 300; // 30.0 Hz
let mode4WidthTenths = 5;   // 0.5 ms
updateDigitGrid2("m4-width", mode4WidthTenths, 100); // 10.0msまで
updateDigitGrid("m4-freq",   mode4FreqTenths);


document.querySelectorAll(".m1-freq-plus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode1FreqTenths += Math.round(step * 10);
    if (mode1FreqTenths > 20000) mode1FreqTenths = 20000;
    if (mode1FreqTenths < 1000)  mode1FreqTenths = 1000;
    updateDigitGrid("m1-freq", mode1FreqTenths);
  });
});
document.querySelectorAll(".m1-freq-minus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode1FreqTenths -= Math.round(step * 10);
    if (mode1FreqTenths > 20000) mode1FreqTenths = 20000;
    if (mode1FreqTenths < 1000)  mode1FreqTenths = 1000;
    updateDigitGrid("m1-freq", mode1FreqTenths);
  });
});

document.querySelectorAll(".m1-width-plus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode1WidthTenths += Math.round(step * 10);
    if (mode1WidthTenths > 300) mode1WidthTenths = 300;
    if (mode1WidthTenths < 1)   mode1WidthTenths = 1;
    updateDigitGrid2("m1-width", mode1WidthTenths, 300);
  });
});
document.querySelectorAll(".m1-width-minus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode1WidthTenths -= Math.round(step * 10);
    if (mode1WidthTenths > 300) mode1WidthTenths = 300;
    if (mode1WidthTenths < 1)   mode1WidthTenths = 1;
    updateDigitGrid2("m1-width", mode1WidthTenths, 300);
  });
});


document.getElementById("m1-play").addEventListener("click", () => {

});

/* ========= モード2: ホワイトノイズ ========= */

m2Gain.gain.value = m2Volume;
let m2Muted = false;
let noiseSource = null;

document.getElementById("m2-start").addEventListener("click", () => {
  if (noiseSource) stopNoise();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const channels = 2;
  const rate = audioCtx.sampleRate;
  const frames = rate * 2;
  const buffer = audioCtx.createBuffer(channels, frames, rate);
  for (let ch = 0; ch < channels; ch++) {
    const data = buffer.getChannelData(ch);
    for (let i = 0; i < frames; i++) {
      data[i] = Math.random() * 2 - 1;
    }
  }
  noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = buffer;
  noiseSource.loop = true;
  noiseSource.connect(m2Gain);
  noiseSource.start();
});
document.getElementById("m2-stop").addEventListener("click", stopNoise);

function stopNoise() {
  if (noiseSource) {
    try { noiseSource.stop(); } catch(e) {}
    noiseSource.disconnect();
    noiseSource = null;
  }
}

/* ========= モード3: 正弦波 ステレオ（指定レイアウト） ========= */
let leftOsc  = null;
let rightOsc = null;
let leftGain  = audioCtx.createGain();
let rightGain = audioCtx.createGain();
let leftPanner  = audioCtx.createStereoPanner();
let rightPanner = audioCtx.createStereoPanner();
leftGain.connect(leftPanner).connect(audioCtx.destination);
rightGain.connect(rightPanner).connect(audioCtx.destination);
let leftVolume  = 0.1;
let rightVolume = 0.1;
leftGain.gain.value  = leftVolume;
rightGain.gain.value = rightVolume;
leftPanner.pan.value  = 0;   // モノラル初期
rightPanner.pan.value = 1;

let leftFreq  = 440;
let rightFreq = 442;
let leftWave  = "sine";
let rightWave = "sine";
let leftMuted  = false;
let rightMuted = false;
let leftRangeMax  = 1000;
let rightRangeMax = 1000;

function updateM3Digits(side) {
  const freq = side === "left" ? leftFreq : rightFreq;

  // 0〜9999.9Hz の範囲にクリップ（必要なら調整）
  let f = Math.max(0, Math.min(freq, 9999.9));

  // 整数部と小数第1位を分解
  let intPart = Math.floor(f);                 // 0〜9999
  let decPart = Math.round((f - intPart) * 10); // 0〜10 になることがある

  // 例: 439.95Hz → intPart=439, decPart=10 みたいな端数対策
  if (decPart === 10) {
    intPart += 1;
    decPart = 0;
  }

  const s = intPart.toString().padStart(4, "0"); // 4桁表示

  const ids = side === "left"
    ? ["m3-left-thousands","m3-left-hundreds","m3-left-tens","m3-left-ones","m3-left-tenths"]
    : ["m3-right-thousands","m3-right-hundreds","m3-right-tens","m3-right-ones","m3-right-tenths"];

  document.getElementById(ids[0]).textContent = s[0];
  document.getElementById(ids[1]).textContent = s[1];
  document.getElementById(ids[2]).textContent = s[2];
  document.getElementById(ids[3]).textContent = s[3];
  document.getElementById(ids[4]).textContent = decPart.toString();
}


updateM3Digits("left");
updateM3Digits("right");
document.getElementById("m3-left-slider").value  = leftFreq;
document.getElementById("m3-right-slider").value = rightFreq;

/* モノラル／ステレオ切替 */

  leftPanner.pan.value = 0;
});
document.getElementById("m3-stereo").addEventListener("change", e => {
  if (!e.target.checked) return;
  // ステレオ: 左右別々
  document.getElementById("right-channel").classList.remove("disabled");
  leftPanner.pan.value  = -1;
  rightPanner.pan.value = 1;
});

/* ========= モード4: 任意パルス（バッファループ版） ========= */
let mode4Gain = audioCtx.createGain();
mode4Gain.connect(audioCtx.destination);
let mode4Muted  = false;
let mode4Volume = 0.1;
mode4Gain.gain.value = mode4Volume;


// 連続再生用
let mode4Running        = false;
let mode4Source         = null;
let mode4AutoStopTimeout = null;

/* --- パラメータ変更ハンドラ（＋/−） --- */
document.querySelectorAll(".m4-width-plus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode4WidthTenths += Math.round(step * 10);
    if (mode4WidthTenths > 100) mode4WidthTenths = 100; // 10.0 ms
    if (mode4WidthTenths < 1)   mode4WidthTenths = 1;   // 0.1 ms
    updateDigitGrid2("m4-width", mode4WidthTenths, 100);
    restartMode4IfRunning();
  });
});
document.querySelectorAll(".m4-width-minus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode4WidthTenths -= Math.round(step * 10);
    if (mode4WidthTenths > 100) mode4WidthTenths = 100;
    if (mode4WidthTenths < 1)   mode4WidthTenths = 1;
    updateDigitGrid2("m4-width", mode4WidthTenths, 100);
    restartMode4IfRunning();
  });
});

document.querySelectorAll(".m4-freq-plus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode4FreqTenths += Math.round(step * 10);
    if (mode4FreqTenths > 10000) mode4FreqTenths = 10000; // 1000.0 Hz
    if (mode4FreqTenths < 1)     mode4FreqTenths = 1;     // 0.1 Hz
    updateDigitGrid("m4-freq", mode4FreqTenths);
    restartMode4IfRunning();
  });
});
document.querySelectorAll(".m4-freq-minus").forEach(btn => {
  btn.addEventListener("click", () => {
    const step = parseFloat(btn.dataset.digit);
    mode4FreqTenths -= Math.round(step * 10);
    if (mode4FreqTenths > 10000) mode4FreqTenths = 10000;
    if (mode4FreqTenths < 1)     mode4FreqTenths = 1;
    updateDigitGrid("m4-freq", mode4FreqTenths);
    restartMode4IfRunning();
  });
});

/* --- 単発生成（従来どおり ConstantSource） --- */
document.getElementById("m4-single").addEventListener("click", () => {
  if (audioCtx.state === "suspended") audioCtx.resume();
  const widthMs = mode4WidthTenths / 10;
  const src = audioCtx.createConstantSource();
  src.offset.value = 1;
  src.connect(mode4Gain);
  src.start();
  src.stop(audioCtx.currentTime + widthMs / 1000);
});

/* --- 連続再生トグル --- */
document.getElementById("m4-toggle").addEventListener("click", () => {
  if (!mode4Running) {
    startMode4Continuous();
  } else {
    stopPulseTrain();
  }
});

/* --- 連続パルス用 AudioBufferSource を作る --- */
function createMode4BufferSource() {
  const freqHz  = mode4FreqTenths / 10;   // [Hz]
  const widthMs = mode4WidthTenths / 10;  // [ms]
  if (freqHz <= 0) return null;

  const sampleRate = audioCtx.sampleRate;
  const periodSec  = 1 / freqHz;
  let periodSamples = Math.round(sampleRate * periodSec);
  if (periodSamples < 1) periodSamples = 1;

  const widthSec = widthMs / 1000;
  let widthSamples = Math.round(sampleRate * widthSec);
  if (widthSamples < 1) widthSamples = 1;
  if (widthSamples > periodSamples) widthSamples = periodSamples;

  // 1周期ぶんのパルス波バッファ（0〜widthSamples-1 が 1.0、それ以外 0.0）
  const buffer = audioCtx.createBuffer(1, periodSamples, sampleRate);
  const data   = buffer.getChannelData(0);
  for (let i = 0; i < widthSamples; i++) {
    data[i] = 1.0;
  }
  for (let i = widthSamples; i < periodSamples; i++) {
    data[i] = 0.0;
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.loop   = true;
  src.connect(mode4Gain);
  src.onended = () => {
    src.disconnect();
    if (mode4Source === src) {
      mode4Source = null;
    }
  };
  return src;
}

/* --- 連続再生開始 --- */
function startMode4Continuous() {
  if (audioCtx.state === "suspended") audioCtx.resume();

  // 既存ソースを止める
  if (mode4Source) {
    try { mode4Source.stop(); } catch (e) {}
    mode4Source.disconnect();
    mode4Source = null;
  }

  const src = createMode4BufferSource();
  if (!src) return;

  mode4Source  = src;
  mode4Running = true;
  src.start();

  const btn = document.getElementById("m4-toggle");
  if (btn) btn.textContent = "停止";

  // 安全のため 5分で自動停止
  if (mode4AutoStopTimeout) {
    clearTimeout(mode4AutoStopTimeout);
    mode4AutoStopTimeout = null;
  }
  mode4AutoStopTimeout = setTimeout(() => {
    stopPulseTrain();
  }, 300000);
}

/* --- パラメータ変更時に再スタート --- */
function restartMode4IfRunning() {
  if (!mode4Running) return;
  startMode4Continuous();
}

/* --- 連続再生停止 --- */
function stopPulseTrain() {
  if (mode4Source) {
    try { mode4Source.stop(); } catch (e) {}
    mode4Source.disconnect();
    mode4Source = null;
  }
  mode4Running = false;

  if (mode4AutoStopTimeout) {
    clearTimeout(mode4AutoStopTimeout);
    mode4AutoStopTimeout = null;
  }

  const btn = document.getElementById("m4-toggle");
  if (btn) btn.textContent = "連続再生";
}

const m4VolSlider  = document.getElementById("m4-volume");
const m4VolDisplay = document.getElementById("m4-volume-display");
m4VolSlider.addEventListener("input", () => {
  const p = parseInt(m4VolSlider.value, 10);
  m4VolDisplay.textContent = p + "%";
  mode4Volume = p / 100;
  if (!mode4Muted) mode4Gain.gain.value = mode4Volume;
});
document.getElementById("m4-mute").addEventListener("click", () => {
  const btn = document.getElementById("m4-mute");
  if (!mode4Muted) {
    mode4Muted = true;
    mode4Gain.gain.value = 0;
    btn.textContent = "ミュート解除";
  } else {
    mode4Muted = false;
    mode4Gain.gain.value = mode4Volume;
    btn.textContent = "ミュート";
  }
});
