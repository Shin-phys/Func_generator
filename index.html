<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Audio Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px;
        }
        .tabs {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .tabs button {
            padding: 10px 20px;
            margin-right: 5px;
            font-size: 1em;
            cursor: pointer;
        }
        .tabs button.active {
            background-color: #ccc;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .tab-content h2 {
            margin-top: 0;
        }
        label {
            display: block;
            margin: 8px 0;
        }
        input[type="range"] {
            vertical-align: middle;
            width: 150px;
        }
        input[type="number"] {
            width: 60px;
        }
        button {
            font-size: 1em;
            padding: 8px 12px;
            margin: 4px;
        }
        .freq-controls {
            display: flex;
            justify-content: space-around;
            margin: 10px 0;
        }
        .freq-controls div {
            flex: 1;
            text-align: center;
        }
        .freq-controls button {
            margin: 2px;
            padding: 4px 8px;
        }
        .preset-buttons {
            display: flex;
            justify-content: space-around;
        }
        .preset-buttons div {
            flex: 1;
            text-align: center;
        }
        .preset-buttons button {
            margin: 2px;
            padding: 4px 8px;
        }
　　　　.wave-type-btn {
    	　　padding: 6px 10px;
    	　　margin: 2px;
    	　　font-size: 1em;
    	　　border: 1px solid #ccc;
    	　　background-color: #eee;
    	　　cursor: pointer;
  　　　}
  .wave-type-btn.active {
    background-color: #007bff;
    color: white;
    border-color: #0056b3;
  }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab active" data-tab="mode1">単発パルス波</button>
    <button class="tab" data-tab="mode2">ホワイトノイズ</button>
    <button class="tab" data-tab="mode3">正弦波（ステレオ）</button>
    <button class="tab" data-tab="mode4">任意パルス波</button>
</div>

<div id="mode1" class="tab-content active">
    <h2>単発パルス波生成</h2>
    <label>周波数: <input id="pulseFreqSlider" type="range" min="250" max="2000" value="1000"> <input id="pulseFreqInput" type="number" min="250" max="2000" value="1000"> Hz</label>
    <label>生成時間: <input id="pulseWidthSlider" type="range" min="1" max="30" value="10"> <input id="pulseWidthInput" type="number" min="1" max="30" value="10"> ms</label>
    <div>
        <button id="pulsePlayBtn">再生</button>
    </div>
    <label>音量: <input id="pulseVolumeSlider" type="range" min="1" max="100" value="10">% </label>
    <button id="pulseMuteBtn">ミュート</button>
</div>

<div id="mode2" class="tab-content">
    <h2>ホワイトノイズ生成</h2>
    <div>
        <button id="noiseStartBtn">開始</button>
        <button id="noiseStopBtn">停止</button>
    </div>
    <label>音量: <input id="noiseVolumeSlider" type="range" min="1" max="100" value="10">% </label>
    <button id="noiseMuteBtn">ミュート</button>
</div>

<div id="mode3" class="tab-content">
    <h2>正弦波生成（ステレオ対応）</h2>
    <div id="waveTypeSelector">
  <label>波形タイプの選択：</label><br>
  <button class="wave-type-btn active" data-type="sine">正弦波</button>
  <button class="wave-type-btn" data-type="square">矩形波</button>
  <button class="wave-type-btn" data-type="triangle">三角波</button>
  <button class="wave-type-btn" data-type="sawtooth">のこぎり波</button>
</div>
　　<label>左周波数: <input id="sineFreqLeftSlider" type="range" min="100" max="2000" value="1000"> <input id="sineFreqLeftInput" type="number" value="1000"> Hz</label>
    <label>右周波数: <input id="sineFreqRightSlider" type="range" min="100" max="2000" value="1000"> <input id="sineFreqRightInput" type="number" value="1000"> Hz</label>
    <label><input type="checkbox" id="monoToggle"> モノラル (モノラル時は左のみ有効)</label>
　　<div>
        <button id="sinePlayBtn">再生</button>
        <button id="sineStopBtn">停止</button>
    </div>
    <label>音量: <input id="sineVolumeSlider" type="range" min="1" max="100" value="10">% </label>
    <button id="sineMuteBtn">ミュート</button>

    <h3>周波数微調整</h3>
    <div class="freq-controls">
        <div>
            <p>左チャンネル</p>
            <button class="adjust-button" data-channel="left" data-step="-0.1">-0.1Hz</button>
            <button class="adjust-button" data-channel="left" data-step="0.1">+0.1Hz</button>
            <button class="adjust-button" data-channel="left" data-step="-1">-1Hz</button>
            <button class="adjust-button" data-channel="left" data-step="1">+1Hz</button>
            <button class="adjust-button" data-channel="left" data-step="-10">-10Hz</button>
            <button class="adjust-button" data-channel="left" data-step="10">+10Hz</button>
            <button class="adjust-button" data-channel="left" data-step="-100">-100Hz</button>
            <button class="adjust-button" data-channel="left" data-step="100">+100Hz</button>
            <button class="adjust-button" data-channel="left" data-step="*2">×2</button>
            <button class="adjust-button" data-channel="left" data-step="/2">÷2</button>
        </div>
        <div>
            <p>右チャンネル</p>
            <button class="adjust-button" data-channel="right" data-step="-0.1">-0.1Hz</button>
            <button class="adjust-button" data-channel="right" data-step="0.1">+0.1Hz</button>
            <button class="adjust-button" data-channel="right" data-step="-1">-1Hz</button>
            <button class="adjust-button" data-channel="right" data-step="1">+1Hz</button>
            <button class="adjust-button" data-channel="right" data-step="-10">-10Hz</button>
            <button class="adjust-button" data-channel="right" data-step="10">+10Hz</button>
            <button class="adjust-button" data-channel="right" data-step="-100">-100Hz</button>
            <button class="adjust-button" data-channel="right" data-step="100">+100Hz</button>
            <button class="adjust-button" data-channel="right" data-step="*2">×2</button>
            <button class="adjust-button" data-channel="right" data-step="/2">÷2</button>
        </div>
    </div>

    <h3>プリセットジャンプ</h3>
    <div class="preset-buttons">
        <div>
            <p>左チャンネル</p>
            <button class="preset-button" data-channel="left" data-value="20">20Hz</button>
            <button class="preset-button" data-channel="left" data-value="31.5">31.5Hz</button>
            <button class="preset-button" data-channel="left" data-value="63">63Hz</button>
            <button class="preset-button" data-channel="left" data-value="125">125Hz</button>
            <button class="preset-button" data-channel="left" data-value="250">250Hz</button>
            <button class="preset-button" data-channel="left" data-value="500">500Hz</button>
            <button class="preset-button" data-channel="left" data-value="1000">1kHz</button>
            <button class="preset-button" data-channel="left" data-value="2000">2kHz</button>
            <button class="preset-button" data-channel="left" data-value="4000">4kHz</button>
            <button class="preset-button" data-channel="left" data-value="6400">6.4kHz</button>
            <button class="preset-button" data-channel="left" data-value="8000">8kHz</button>
            <button class="preset-button" data-channel="left" data-value="10000">10kHz</button>
            <button class="preset-button" data-channel="left" data-value="16000">16kHz</button>
            <button class="preset-button" data-channel="left" data-value="18000">18kHz</button>
            <button class="preset-button" data-channel="left" data-value="19000">19kHz</button>
            <button class="preset-button" data-channel="left" data-value="20000">20kHz</button>
        </div>
        <div>
            <p>右チャンネル</p>
            <button class="preset-button" data-channel="right" data-value="20">20Hz</button>
            <button class="preset-button" data-channel="right" data-value="31.5">31.5Hz</button>
            <button class="preset-button" data-channel="right" data-value="63">63Hz</button>
            <button class="preset-button" data-channel="right" data-value="125">125Hz</button>
            <button class="preset-button" data-channel="right" data-value="250">250Hz</button>
            <button class="preset-button" data-channel="right" data-value="500">500Hz</button>
            <button class="preset-button" data-channel="right" data-value="1000">1kHz</button>
            <button class="preset-button" data-channel="right" data-value="2000">2kHz</button>
            <button class="preset-button" data-channel="right" data-value="4000">4kHz</button>
            <button class="preset-button" data-channel="right" data-value="6400">6.4kHz</button>
            <button class="preset-button" data-channel="right" data-value="8000">8kHz</button>
            <button class="preset-button" data-channel="right" data-value="10000">10kHz</button>
            <button class="preset-button" data-channel="right" data-value="16000">16kHz</button>
            <button class="preset-button" data-channel="right" data-value="18000">18kHz</button>
            <button class="preset-button" data-channel="right" data-value="19000">19kHz</button>
            <button class="preset-button" data-channel="right" data-value="20000">20kHz</button>
        </div>
    </div>
</div>

<div id="mode4" class="tab-content">
    <h2>任意パルス幅・任意周期パルス生成</h2>
    <label>パルス幅: <input id="arbPulseWidthSlider" type="range" min="0.1" max="10" step="0.1" value="1"> <input id="arbPulseWidthInput" type="number" min="0.1" max="10" step="0.1" value="0.1"> ms</label>
    <label>周波数: <input id="arbPulseFreqSlider" type="range" min="0.1" max="1000" step="0.1" value="10"> <input id="arbPulseFreqInput" type="number" min="0.1" max="1000" step="0.1" value="30"> Hz</label>
    <div>
        <button id="arbSingleBtn">単発生成</button>
        <button id="arbPlayBtn">再生</button>
        <button id="arbStopBtn">停止</button>
    </div>
    <label>音量: <input id="arbVolumeSlider" type="range" min="1" max="100" value="10">% </label>
    <button id="arbMuteBtn">ミュート</button>
</div>

<script>
// Tab functionality
const tabs = document.querySelectorAll('.tabs button');
const tabContents = document.querySelectorAll('.tab-content');
tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        // Deactivate all tabs
        tabs.forEach(t => t.classList.remove('active'));
        tabContents.forEach(tc => tc.classList.remove('active'));
        // Activate selected tab
        tab.classList.add('active');
        const target = tab.getAttribute('data-tab');
        document.getElementById(target).classList.add('active');
        stopAllAudio(); // stop audio when switching tabs
    });
});

// Audio Context
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

// Keep track of sources and timers for stopping
let activeAudioSources = [];
let activeIntervals = [];
let activeTimeouts = [];
let noiseSource = null;
let leftOsc = null;
let rightOsc = null;

// Stop all audio sources and intervals
function stopAllAudio() {
    activeAudioSources.forEach(src => {
        try { src.stop(); } catch(e) {}
        try { src.disconnect(); } catch(e) {}
    });
    activeAudioSources = [];
    noiseSource = null;
    // Stop stereo oscillators
    if (leftOsc) leftOsc = null;
    if (rightOsc) rightOsc = null;
    activeIntervals.forEach(id => clearInterval(id));
    activeIntervals = [];
    activeTimeouts.forEach(id => clearTimeout(id));
    activeTimeouts = [];
}

// Mode 1: Single Pulse Wave
const pulseFreqSlider = document.getElementById('pulseFreqSlider');
const pulseFreqInput = document.getElementById('pulseFreqInput');
const pulseWidthSlider = document.getElementById('pulseWidthSlider');
const pulseWidthInput = document.getElementById('pulseWidthInput');
const pulsePlayBtn = document.getElementById('pulsePlayBtn');
const pulseVolumeSlider = document.getElementById('pulseVolumeSlider');
const pulseMuteBtn = document.getElementById('pulseMuteBtn');

let pulseMute = false;
let pulseGain = audioCtx.createGain();
pulseGain.gain.value = pulseVolumeSlider.value/100;
pulseGain.connect(audioCtx.destination);

pulseFreqSlider.addEventListener('input', () => {
    pulseFreqInput.value = pulseFreqSlider.value;
});
pulseFreqInput.addEventListener('input', () => {
    let val = Math.max(250, Math.min(2000, pulseFreqInput.value));
    pulseFreqInput.value = val;
    pulseFreqSlider.value = val;
});
pulseWidthSlider.addEventListener('input', () => {
    pulseWidthInput.value = pulseWidthSlider.value;
});
pulseWidthInput.addEventListener('input', () => {
    let val = Math.max(1, Math.min(30, pulseWidthInput.value));
    pulseWidthInput.value = val;
    pulseWidthSlider.value = val;
});
pulseVolumeSlider.addEventListener('input', () => {
    if (!pulseMute) {
        pulseGain.gain.value = pulseVolumeSlider.value/100;
    }
});
pulseMuteBtn.addEventListener('click', () => {
    pulseMute = !pulseMute;
    pulseGain.gain.value = pulseMute ? 0 : pulseVolumeSlider.value/100;
    pulseMuteBtn.textContent = pulseMute ? 'ミュート解除' : 'ミュート';
});

pulsePlayBtn.addEventListener('click', () => {
    const freq = parseFloat(pulseFreqInput.value);
    const width = parseFloat(pulseWidthInput.value) / 1000; // ms to sec
    if (!pulseMute && pulseVolumeSlider.value > 0) {
        const osc = audioCtx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        osc.connect(pulseGain);
        osc.start();
        osc.stop(audioCtx.currentTime + width);
        activeAudioSources.push(osc);
        // Cleanup after stop
        osc.onended = () => {
            activeAudioSources = activeAudioSources.filter(s => s !== osc);
            osc.disconnect();
        };
    }
});

// Mode 2: White Noise
const noiseStartBtn = document.getElementById('noiseStartBtn');
const noiseStopBtn = document.getElementById('noiseStopBtn');
const noiseVolumeSlider = document.getElementById('noiseVolumeSlider');
const noiseMuteBtn = document.getElementById('noiseMuteBtn');

let noiseMute = false;
let noiseGain = audioCtx.createGain();
noiseGain.gain.value = noiseVolumeSlider.value/100;
noiseGain.connect(audioCtx.destination);

noiseStartBtn.addEventListener('click', () => {
    if (!noiseSource) {
        const bufferSize = 2 * audioCtx.sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true;
        source.connect(noiseGain);
        source.start();
        noiseSource = source;
        activeAudioSources.push(source);
        source.onended = () => {
            noiseSource = null;
        };
    }
});
noiseStopBtn.addEventListener('click', () => {
    if (noiseSource) {
        noiseSource.stop();
        noiseSource.disconnect();
        activeAudioSources = activeAudioSources.filter(s => s !== noiseSource);
        noiseSource = null;
    }
});
noiseVolumeSlider.addEventListener('input', () => {
    if (!noiseMute) {
        noiseGain.gain.value = noiseVolumeSlider.value/100;
    }
});
noiseMuteBtn.addEventListener('click', () => {
    noiseMute = !noiseMute;
    noiseGain.gain.value = noiseMute ? 0 : noiseVolumeSlider.value/100;
    noiseMuteBtn.textContent = noiseMute ? 'ミュート解除' : 'ミュート';
});

// Mode 3: Sine Wave Stereo
const sineFreqLeftSlider = document.getElementById('sineFreqLeftSlider');
const sineFreqLeftInput = document.getElementById('sineFreqLeftInput');
const sineFreqRightSlider = document.getElementById('sineFreqRightSlider');
const sineFreqRightInput = document.getElementById('sineFreqRightInput');
const monoToggle = document.getElementById('monoToggle');
const sinePlayBtn = document.getElementById('sinePlayBtn');
const sineStopBtn = document.getElementById('sineStopBtn');
const sineVolumeSlider = document.getElementById('sineVolumeSlider');
const sineMuteBtn = document.getElementById('sineMuteBtn');

let sineMute = false;
let sineGain = audioCtx.createGain();
sineGain.gain.value = sineVolumeSlider.value/100;
sineGain.connect(audioCtx.destination);

sineFreqLeftSlider.addEventListener('input', () => {
    sineFreqLeftInput.value = sineFreqLeftSlider.value;
　　 updateSineFrequencies();
});
sineFreqLeftInput.addEventListener('input', () => {
    let val = Math.max(100, Math.min(2000, sineFreqLeftInput.value));
    sineFreqLeftInput.value = val;
    sineFreqLeftSlider.value = val;
　　 updateSineFrequencies();
});
sineFreqRightSlider.addEventListener('input', () => {
    sineFreqRightInput.value = sineFreqRightSlider.value;
　　 updateSineFrequencies();
});
sineFreqRightInput.addEventListener('input', () => {
    let val = Math.max(100, Math.min(2000, sineFreqRightInput.value));
    sineFreqRightInput.value = val;
    sineFreqRightSlider.value = val;
　　 updateSineFrequencies();
});
sineVolumeSlider.addEventListener('input', () => {
    if (!sineMute) {
        sineGain.gain.value = sineVolumeSlider.value/100;
    }
});
sineMuteBtn.addEventListener('click', () => {
    sineMute = !sineMute;
    sineGain.gain.value = sineMute ? 0 : sineVolumeSlider.value/100;
    sineMuteBtn.textContent = sineMute ? 'ミュート解除' : 'ミュート';
});

function updateSineFrequencies() {
  if (leftOsc) leftOsc.frequency.setValueAtTime(parseFloat(sineFreqLeftInput.value), audioCtx.currentTime);
  if (rightOsc) rightOsc.frequency.setValueAtTime(parseFloat(sineFreqRightInput.value), audioCtx.currentTime);
}

let currentWaveType = "sine"; // 初期波形

document.querySelectorAll(".wave-type-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    // すべてのボタンから active を外す
    document.querySelectorAll(".wave-type-btn").forEach(b => b.classList.remove("active"));
    // 今回選ばれたボタンに active を付ける
    btn.classList.add("active");
    // 現在の波形タイプを更新
    currentWaveType = btn.dataset.type;
　　const isPlaying = (leftOsc || rightOsc);
  　if (isPlaying) {
   　 sineStopBtn.click();      // 停止
   　 setTimeout(() => {
   　   sinePlayBtn.click();    // 少し遅らせて再生（停止が完了するのを待つ）
    　}, 100); // 100ms程度でOK
　　}
  });
});

sinePlayBtn.addEventListener('click', () => {
    if (!leftOsc && !rightOsc) {
        const freqL = parseFloat(sineFreqLeftInput.value);
        const freqR = parseFloat(sineFreqRightInput.value);
        const merger = audioCtx.createChannelMerger(2);
        if (!monoToggle.checked) {
            leftOsc = audioCtx.createOscillator();
            rightOsc = audioCtx.createOscillator();
            leftOsc.type = currentWaveType;
            rightOsc.type = currentWaveType;
            leftOsc.frequency.value = freqL;
            rightOsc.frequency.value = freqR;
            const leftGain = audioCtx.createGain();
            const rightGain = audioCtx.createGain();
            leftOsc.connect(leftGain).connect(merger, 0, 0);
            rightOsc.connect(rightGain).connect(merger, 0, 1);
            leftOsc.start();
            rightOsc.start();
            activeAudioSources.push(leftOsc);
            activeAudioSources.push(rightOsc);
            merger.connect(sineGain);
        } else {
            leftOsc = audioCtx.createOscillator();
            leftOsc.type = currentWaveType;
            leftOsc.frequency.value = freqL;
            const leftGain = audioCtx.createGain();
            leftOsc.connect(leftGain).connect(merger, 0, 0);
            leftOsc.start();
            activeAudioSources.push(leftOsc);
            merger.connect(sineGain);
        }
        // Cleanup on end
        const cleanup = (osc) => {
            osc.onended = () => {
                activeAudioSources = activeAudioSources.filter(s => s !== osc);
                osc.disconnect();
            };
        };
        if (leftOsc) cleanup(leftOsc);
        if (rightOsc) cleanup(rightOsc);
    }
});

sineStopBtn.addEventListener('click', () => {
    [leftOsc, rightOsc].forEach(osc => {
        if (osc) {
            osc.stop();
        }
    });
    leftOsc = null;
    rightOsc = null;
});

document.querySelectorAll('.adjust-button').forEach(btn => {
    btn.addEventListener('click', () => {
        const channel = btn.getAttribute('data-channel');
        const step = btn.getAttribute('data-step');
        let inputElem = (channel === 'left') ? sineFreqLeftInput : sineFreqRightInput;
        let sliderElem = (channel === 'left') ? sineFreqLeftSlider : sineFreqRightSlider;
        let value = parseFloat(inputElem.value);
        if (step.startsWith('*')) {
            value *= parseFloat(step.substring(1));
        } else if (step.startsWith('/')) {
            value /= parseFloat(step.substring(1));
        } else {
            value += parseFloat(step);
        }
        value = Math.max(20, Math.min(20000, value));
        inputElem.value = value;
        if (value < 100) {
            sliderElem.value = 100;
        } else if (value > 2000) {
            sliderElem.value = 2000;
        } else {
            sliderElem.value = value;
        }
　　　　updateSineFrequencies();
    });
});

document.querySelectorAll('.preset-button').forEach(btn => {
    btn.addEventListener('click', () => {
        const channel = btn.getAttribute('data-channel');
        const val = parseFloat(btn.getAttribute('data-value'));
        let inputElem = (channel === 'left') ? sineFreqLeftInput : sineFreqRightInput;
        let sliderElem = (channel === 'left') ? sineFreqLeftSlider : sineFreqRightSlider;
        inputElem.value = val;
        if (val < 100) {
            sliderElem.value = 100;
        } else if (val > 2000) {
            sliderElem.value = 2000;
        } else {
            sliderElem.value = val;
        }
　　　　updateSineFrequencies();
    });
});

// Mode 4: Arbitrary Pulse Wave
const arbPulseWidthSlider = document.getElementById('arbPulseWidthSlider');
const arbPulseWidthInput = document.getElementById('arbPulseWidthInput');
const arbPulseFreqSlider = document.getElementById('arbPulseFreqSlider');
const arbPulseFreqInput = document.getElementById('arbPulseFreqInput');
const arbSingleBtn = document.getElementById('arbSingleBtn');
const arbPlayBtn = document.getElementById('arbPlayBtn');
const arbStopBtn = document.getElementById('arbStopBtn');
const arbVolumeSlider = document.getElementById('arbVolumeSlider');
const arbMuteBtn = document.getElementById('arbMuteBtn');

let arbMute = false;
let arbGain = audioCtx.createGain();
arbGain.gain.value = arbVolumeSlider.value/100;
arbGain.connect(audioCtx.destination);

arbPulseWidthSlider.addEventListener('input', () => {
    arbPulseWidthInput.value = arbPulseWidthSlider.value;
});
arbPulseWidthInput.addEventListener('input', () => {
    let val = Math.max(0.1, Math.min(10, arbPulseWidthInput.value));
    arbPulseWidthInput.value = val;
    arbPulseWidthSlider.value = val;
});
arbPulseFreqSlider.addEventListener('input', () => {
    arbPulseFreqInput.value = arbPulseFreqSlider.value;
});
arbPulseFreqInput.addEventListener('input', () => {
    let val = Math.max(0.1, Math.min(1000, arbPulseFreqInput.value));
    arbPulseFreqInput.value = val;
    arbPulseFreqSlider.value = val;
});
arbVolumeSlider.addEventListener('input', () => {
    if (!arbMute) {
        arbGain.gain.value = arbVolumeSlider.value/100;
    }
});
arbMuteBtn.addEventListener('click', () => {
    arbMute = !arbMute;
    arbGain.gain.value = arbMute ? 0 : arbVolumeSlider.value/100;
    arbMuteBtn.textContent = arbMute ? 'ミュート解除' : 'ミュート';
});

let arbIntervalId = null;
let arbTimeoutId = null;

function startArbPulses() {
    const width = parseFloat(arbPulseWidthInput.value); // ms
    const freq = parseFloat(arbPulseFreqInput.value); // Hz
    if (freq <= 0) return;
    const period = 1000 / freq;
    arbIntervalId = setInterval(() => {
        if (!arbMute && arbVolumeSlider.value > 0) {
            const osc = audioCtx.createOscillator();
            osc.type = 'square';
            osc.frequency.value = 1000;
            osc.connect(arbGain);
            osc.start();
            osc.stop(audioCtx.currentTime + (width/1000));
            activeAudioSources.push(osc);
            osc.onended = () => {
                activeAudioSources = activeAudioSources.filter(s => s !== osc);
                osc.disconnect();
            };
        }
    }, period);
    activeIntervals.push(arbIntervalId);
    arbTimeoutId = setTimeout(() => {
        stopArbPulses();
    }, 5 * 60 * 1000);
    activeTimeouts.push(arbTimeoutId);
}

function stopArbPulses() {
    if (arbIntervalId) {
        clearInterval(arbIntervalId);
        activeIntervals = activeIntervals.filter(id => id !== arbIntervalId);
        arbIntervalId = null;
    }
    if (arbTimeoutId) {
        clearTimeout(arbTimeoutId);
        activeTimeouts = activeTimeouts.filter(id => id !== arbTimeoutId);
        arbTimeoutId = null;
    }
    activeAudioSources.forEach(src => {
        try { src.stop(); } catch(e) {}
        try { src.disconnect(); } catch(e) {}
    });
    activeAudioSources = [];
}

arbSingleBtn.addEventListener('click', () => {
    const width = parseFloat(arbPulseWidthInput.value) / 1000;
    if (!arbMute && arbVolumeSlider.value > 0) {
        const osc = audioCtx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = 1000;
        osc.connect(arbGain);
        osc.start();
        osc.stop(audioCtx.currentTime + width);
        activeAudioSources.push(osc);
        osc.onended = () => {
            activeAudioSources = activeAudioSources.filter(s => s !== osc);
            osc.disconnect();
        };
    }
});
arbPlayBtn.addEventListener('click', () => {
    if (!arbIntervalId) {
        startArbPulses();
    }
});
arbStopBtn.addEventListener('click', () => {
    stopArbPulses();
});
</script>
